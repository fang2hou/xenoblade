repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
        files: \.json$
      - id: check-yaml
        files: \.ya?ml$
      - id: check-toml
        files: \.toml$

  - repo: local
    hooks:
      - id: cog-verify
        name: conventional commit
        entry: cog verify --file
        language: system
        stages: [commit-msg]

      - id: pnpm-test
        name: pnpm test
        entry: pnpm test
        language: system
        pass_filenames: false
        stages: [pre-push]

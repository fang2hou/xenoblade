# Docker Compose for the Discord Runtime.
#
# This file lives on the self-hosted host at $GATEWAY_DEPLOY_PATH.
# It is also kept in the repository for version control.
#
# Usage on the host:
#   1. Clone the repo (or copy this file) to $GATEWAY_DEPLOY_PATH.
#   2. Create a .env file with the secrets listed below.
#   3. docker login $DOCKER_REGISTRY_URL (one-time).
#   4. docker compose pull && docker compose up -d

# Required environment variables in .env:
#   DISCORD_BOT_TOKEN=
#   DISCORD_APPLICATION_ID=
#   DISCORD_PUBLIC_KEY=
#   WORKER_URL=https://your-worker.workers.dev
#   INTERNAL_API_TOKEN=
#
services:
  discord-runtime:
    image: ${DOCKER_REGISTRY_URL}/xenoblade/discord-runtime:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    # Bind health endpoint to localhost only — not exposed to the public
    # internet. All real traffic is outbound (Gateway WebSocket + Worker HTTPS).
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

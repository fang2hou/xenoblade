# Docker Compose for the Discord Runtime.
#
# This file lives on the self-hosted host at $RUNTIME_DEPLOY_PATH.
# It is also kept in the repository for version control.
#
# Usage on the host:
#   1. Clone the repo (or copy this file) to $RUNTIME_DEPLOY_PATH.
#   2. Create a .env file with the secrets listed below.
#   3. docker login $REGISTRY_URL (one-time).
#   4. docker compose pull && docker compose up -d
#
services:
  discord-runtime:
    image: ${REGISTRY_URL}/xenoblade/discord-runtime:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    # No published ports: the container communicates entirely via outbound
    # connections (Discord Gateway WebSocket + Worker HTTPS). The health
    # endpoint is accessible only from the host's localhost for monitoring.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Run project checks (mise run check)
        run: mise run check

      - name: Run test suite (pnpm test)
        run: pnpm test

  commits:
    name: Validate commit history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository (full history for cog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5

      - name: Check commit history (cog check)
        run: cog check

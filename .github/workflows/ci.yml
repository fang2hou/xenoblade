name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install tools (mise)
        run: mise install

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: mise run check

      - name: Run tests
        run: mise run test

  commits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install tools (mise)
        run: mise install

      - name: Configure git identity for cocogitto
        run: git config --global user.name ci && git config --global user.email ci@users.noreply.github.com

      - name: Validate commit history (cog)
        if: github.event_name == 'push'
        run: cog check

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$PR_TITLE"

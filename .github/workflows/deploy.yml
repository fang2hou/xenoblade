name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (main pushes only)"
        required: true
        default: all
        type: choice
        options: [all, worker, runtime]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY_URL }}

jobs:
  # ── Stage 1: Check ──────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Secret scan
        run: gitleaks detect --source . --no-banner --redact --verbose

  # ── Stage 2a: Deploy Worker (Cloudflare) ────────────────────────────
  deploy-worker:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event.inputs.target != 'runtime' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      - name: Deploy Platform Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/platform-worker
        run: pnpm exec wrangler deploy

      - name: Verify health
        env:
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          STATUS=$(curl -sf -H "Authorization: Bearer $INTERNAL_API_TOKEN" \
            https://xenoblade-platform.fang2hou.workers.dev/internal/v1/health | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "Worker status: $STATUS"
          [ "$STATUS" = "ok" ] || exit 1

  # ── Stage 2b: Deploy Runtime (Gateway host) ─────────────────────────
  deploy-runtime:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event.inputs.target != 'worker' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      - name: Bundle discord-runtime
        run: pnpm --filter @xenoblade/discord-runtime build

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASS }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: apps/discord-runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:latest
            ${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:buildcache,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GATEWAY_HOST }}
          username: ${{ secrets.GATEWAY_USER }}
          key: ${{ secrets.GATEWAY_SSH_KEY }}
          port: ${{ secrets.GATEWAY_SSH_PORT }}
          script: |
            cd ${{ secrets.GATEWAY_DEPLOY_PATH }}
            docker compose pull
            docker compose down
            docker compose up -d

            # Health check
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8397/health; then
                echo "Runtime healthy on :8397"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed" >&2
            exit 1

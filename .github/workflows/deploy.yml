name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: all
        type: choice
        options: [all, worker, runtime]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Platform Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && (github.event.inputs.target != 'runtime' || github.event_name == 'push')
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        working-directory: apps/platform-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply xenoblade --remote

      - name: Sync Worker secrets
        working-directory: apps/platform-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HYPER_API_KEY: ${{ secrets.HYPER_API_KEY }}
          ADMIN_GUILD_ID: ${{ secrets.ADMIN_GUILD_ID }}
          ADMIN_OWNER_USER_ID: ${{ secrets.ADMIN_OWNER_USER_ID }}
        run: |
          for key in HYPER_API_KEY ADMIN_GUILD_ID ADMIN_OWNER_USER_ID; do
            val="${!key:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | pnpm exec wrangler secret put "$key" >/dev/null
              echo "Synced Worker secret: $key"
            fi
          done

      - name: Deploy Worker
        working-directory: apps/platform-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

      - name: Verify Worker health
        env:
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          STATUS=$(curl -sf -H "Authorization: Bearer $INTERNAL_API_TOKEN" \
            https://xenoblade-platform.fang2hou.workers.dev/internal/v1/health | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "Worker status: $STATUS"
          [ "$STATUS" = "ok" ] || exit 1

  deploy-runtime:
    name: Deploy Discord Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && (github.event.inputs.target != 'worker' || github.event_name == 'push')
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Bundle discord-runtime (mise run build)
        run: mise run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASS }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: apps/discord-runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:latest
            ${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:buildcache,mode=max

      - name: Deploy runtime via SSH
        uses: appleboy/ssh-action@v1
        env:
          GATEWAY_DEPLOY_PATH: ${{ secrets.GATEWAY_DEPLOY_PATH }}
          SYNC_ADMIN_GUILD_ID: ${{ secrets.ADMIN_GUILD_ID }}
          SYNC_ADMIN_OWNER_USER_ID: ${{ secrets.ADMIN_OWNER_USER_ID }}
        with:
          host: ${{ secrets.GATEWAY_HOST }}
          username: ${{ secrets.GATEWAY_USER }}
          key: ${{ secrets.GATEWAY_SSH_KEY }}
          port: ${{ secrets.GATEWAY_SSH_PORT }}
          envs: GATEWAY_DEPLOY_PATH,SYNC_ADMIN_GUILD_ID,SYNC_ADMIN_OWNER_USER_ID
          script: |
            cd "$GATEWAY_DEPLOY_PATH"
            touch .env
            chmod 600 .env
            python3 - <<'PY'
            import os, pathlib
            env_path = pathlib.Path(".env")
            lines = env_path.read_text(encoding="utf-8").splitlines()
            updates = {}
            for key in ["ADMIN_GUILD_ID", "ADMIN_OWNER_USER_ID"]:
                val = os.environ.get(f"SYNC_{key}", "").strip()
                if val:
                    updates[key] = val
            if updates:
                seen = set()
                out = []
                for line in lines:
                    if "=" in line and not line.lstrip().startswith("#"):
                        k = line.split("=", 1)[0].strip()
                        if k in updates:
                            out.append(f"{k}={updates[k]}")
                            seen.add(k)
                            continue
                    out.append(line)
                for k, v in updates.items():
                    if k not in seen:
                        out.append(f"{k}={v}")
                tmp = env_path.with_suffix(".env.tmp")
                tmp.write_text("\n".join(out) + "\n", encoding="utf-8")
                os.chmod(tmp, 0o600)
                os.replace(tmp, env_path)
                print("Synced runtime .env keys:", ", ".join(sorted(updates.keys())))
            PY
            docker compose pull
            docker compose down
            docker compose up -d

            for i in $(seq 1 15); do
              if curl -sf http://localhost:8397/health; then
                echo "Runtime healthy on :8397"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed" >&2
            exit 1

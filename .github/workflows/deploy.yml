name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: all
        type: choice
        options:
          - all
          - runtime
          - worker

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      TARGET: ${{ github.event.inputs.target || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------
      # Deploy Platform Worker (Cloudflare)
      # ---------------------------------------------------------------
      - name: Deploy Worker
        if: env.TARGET != 'runtime'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/platform-worker
        run: pnpm exec wrangler deploy

      # ---------------------------------------------------------------
      # Build & push Docker image (Discord Runtime)
      # ---------------------------------------------------------------
      - name: Set up QEMU
        if: env.TARGET != 'worker'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: env.TARGET != 'worker'
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: env.TARGET != 'worker'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and push image
        if: env.TARGET != 'worker'
        uses: docker/build-push-action@v6
        with:
          context: apps/discord-runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/xenoblade/discord-runtime:latest
            ${{ secrets.REGISTRY_URL }}/xenoblade/discord-runtime:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/xenoblade/discord-runtime:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/xenoblade/discord-runtime:buildcache,mode=max

      # ---------------------------------------------------------------
      # SSH into host: pull, stop old, start new, health check
      # ---------------------------------------------------------------
      - name: Deploy Runtime via SSH
        if: env.TARGET != 'worker'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.RUNTIME_HOST }}
          username: ${{ secrets.RUNTIME_USER }}
          key: ${{ secrets.RUNTIME_SSH_KEY }}
          port: ${{ secrets.RUNTIME_SSH_PORT }}
          script: |
            cd ${{ secrets.RUNTIME_DEPLOY_PATH }}
            docker compose pull
            docker compose down
            docker compose up -d

            # Health check (local to the host)
            for i in $(seq 1 15); do
              if curl -sf http://localhost:3000/health; then
                echo "Runtime is healthy."
                exit 0
              fi
              sleep 2
            done
            echo "Runtime failed health check." >&2
            exit 1

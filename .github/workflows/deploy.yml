name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: all
        type: choice
        options: [all, worker, runtime]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Platform Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && (github.event.inputs.target != 'runtime' || github.event_name == 'push')
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        working-directory: apps/platform-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply xenoblade --remote

      - name: Deploy Worker
        working-directory: apps/platform-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

      - name: Verify Worker health
        env:
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          STATUS=$(curl -sf -H "Authorization: Bearer $INTERNAL_API_TOKEN" \
            https://xenoblade-platform.fang2hou.workers.dev/internal/v1/health | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "Worker status: $STATUS"
          [ "$STATUS" = "ok" ] || exit 1

  deploy-runtime:
    name: Deploy Discord Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && (github.event.inputs.target != 'worker' || github.event_name == 'push')
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Bundle discord-runtime
        run: pnpm --filter @xenoblade/discord-runtime build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASS }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/discord-runtime
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:latest
            ${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY_URL }}/xenoblade/discord-runtime:buildcache,mode=max

      - name: Deploy runtime via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.GATEWAY_HOST }}
          username: ${{ secrets.GATEWAY_USER }}
          key: ${{ secrets.GATEWAY_SSH_KEY }}
          port: ${{ secrets.GATEWAY_SSH_PORT }}
          script: |
            cd ${{ secrets.GATEWAY_DEPLOY_PATH }}
            docker compose pull
            docker compose down
            docker compose up -d

            # Health check
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8397/health; then
                echo "Runtime healthy on :8397"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed" >&2
            exit 1

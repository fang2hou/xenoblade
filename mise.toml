[tools]
node = "24"
pnpm = "12.23.0"
prek = "0.5.11"
cocogitto = "7.0.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.lint]
run = "pnpm lint"

[tasks.format]
run = "pnpm format:check"

[tasks.typecheck]
run = "pnpm typecheck"

[tasks.secrets]
run = "gitleaks dir . --redact"

[tasks.workflows]
run = "actionlint"

[tasks.check]
depends = ["lint", "format", "typecheck", "secrets", "workflows"]

[tasks.test]
depends = ["check"]
run = "pnpm test"

[tasks.build]
run = "pnpm -r build"

[tasks.dev]
run = "pnpm dev"

[tasks.deploy]
run = "pnpm deploy"
